<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#526657">
  <meta name="description" content="サロンのご褒美くじ引き。好きな一枚を選んで、小さな幸運を。">
  <title>ご褒美くじ引き</title>
  <link rel="icon" type="image/svg+xml" href="../leaf.svg">
  <script src="../storage.js?v=20261119-test2" defer></script>
  <script src="../draw-log.js?v=20261119-test2" defer></script>
  <style>
    :root{color-scheme:light;--ink:#34483d;--muted:#778075;--green:#526657;--gold:#b08d50;--paper:#fffefa;--serif:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;--sans:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 5% 5%,#eaf0e4,transparent 62%),radial-gradient(ellipse at 95% 90%,#f2e9d8,transparent 65%),#f7f6f0;color:var(--ink);font:14px/1.8 var(--sans)}main{max-width:570px;margin:auto;padding:20px 18px 48px;text-align:center}
    a{color:inherit;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.back{display:block;text-align:left;min-height:38px;font-size:12px}.brand{display:flex;justify-content:center;align-items:center;gap:9px;font-size:12px;color:var(--muted)}.brand img{width:28px;height:28px}.eyebrow{font-size:10px;letter-spacing:.23em;color:var(--muted);margin:25px 0 2px}h1,h2{font-family:var(--serif);font-weight:500}h1{font-size:clamp(27px,7vw,38px);letter-spacing:.06em;margin:0 0 5px}.lead{font-size:13px;color:var(--muted);margin:4px 0 22px}
    .card{background:var(--paper);border:1px solid #dfe4d8;border-radius:24px;padding:25px 15px 22px;box-shadow:0 16px 45px #34483d12}.steps{display:flex;justify-content:center;gap:10px;margin:0 auto 22px;padding:0;list-style:none}.steps li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}.steps li span{display:grid;place-items:center;width:22px;height:22px;border:1px solid #d6ddcf;border-radius:50%}.steps li.current{color:var(--green);font-weight:700}.steps li.current span{color:#fff;background:var(--green)}.instruction{font-size:13px;margin:0 0 14px;min-height:24px}
    .tickets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:405px;margin:auto}.ticket{position:relative;min-height:158px;border:1px solid #e6dbc8;border-radius:13px;background:#fcf4e5;color:#6c5942;cursor:pointer;padding:15px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 13px #7b653019;transition:transform .22s,background .22s,border-color .22s}.ticket::before{content:"";position:absolute;inset:6px;border:1px dashed #d3bc97;border-radius:9px;pointer-events:none}.ticket:hover:not(:disabled){transform:translateY(-4px)}.ticket.selected{border-color:var(--green);background:#f0f4ec;box-shadow:0 0 0 2px var(--green) inset,0 7px 13px #7b653019}.ticket:disabled:not(.selected){opacity:.55}.ticket .icon{font:500 38px/1.3 var(--serif);color:var(--gold)}.ticket strong{font-size:13px}.ticket small{font-size:10px;color:var(--muted)}.ticket.opening .icon{animation:reveal .9s ease-in-out}.ticket.opened{background:#f9f0d9}.ticket.opened .icon{color:var(--green)}@keyframes reveal{0%{transform:scale(1) rotate(0)}30%{transform:scale(.75) rotate(-8deg)}65%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
    .start,.retry{font:700 15px/1.5 var(--sans);border:0;border-radius:12px;background:var(--green);color:white;cursor:pointer;min-height:52px;padding:11px 20px}.start{width:min(100%,320px);margin:24px auto 0}.retry{min-height:44px;margin-top:13px;background:#6b7d69}.start:disabled,.retry:disabled{opacity:.6;cursor:default}.result{margin-top:19px;padding:18px 12px;border:1px solid #dbc6a1;background:#fdf5e5;border-radius:17px;animation:appear .35s ease both}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.result .award-rank{font-weight:700;color:#8f6e39;font-size:13px}.result h2{font-size:clamp(20px,5vw,27px);margin:4px 0;overflow-wrap:anywhere}.result .award-detail{display:block;font-size:.5em;letter-spacing:0;margin-top:3px}.result .receipt{font-size:12px;overflow-wrap:anywhere}.note{font-size:11px;color:var(--muted);margin-top:18px}[hidden]{display:none!important}@media(max-width:365px){.tickets{gap:6px}.ticket{min-height:139px;padding:10px 2px}.ticket .icon{font-size:30px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="https://1ma-ma-ma1.github.io/salon-nfc-menu/lottery/">← 抽選一覧へ戻る</a>
    <div class="brand"><img src="../leaf.svg" alt="">リラクゼーションサロン</div>
    <p class="eyebrow">A LITTLE GIFT FOR YOU</p>
    <h1>ご褒美くじ引き</h1>
    <p class="lead">お好きなくじを一枚選んで、<br>今日の小さな幸運をお楽しみください。</p>
    <section class="card" aria-label="くじ引き">
      <ol class="steps" aria-label="抽選の流れ"><li class="current" id="step-one"><span>1</span>えらぶ</li><li id="step-two"><span>2</span>ひらく</li><li id="step-three"><span>3</span>うけとる</li></ol>
      <p id="instruction" class="instruction" role="status" aria-live="polite">くじをひとつ選んでください</p>
      <div class="tickets" role="group" aria-label="くじを選択">
        <button class="ticket" type="button" data-index="0" aria-pressed="false"><span class="icon" aria-hidden="true">✧</span><strong>左のくじ</strong><small>LUCKY TICKET</small></button>
        <button class="ticket" type="button" data-index="1" aria-pressed="false"><span class="icon" aria-hidden="true">✧</span><strong>真ん中のくじ</strong><small>LUCKY TICKET</small></button>
        <button class="ticket" type="button" data-index="2" aria-pressed="false"><span class="icon" aria-hidden="true">✧</span><strong>右のくじ</strong><small>LUCKY TICKET</small></button>
      </div>
      <button class="start" type="button" id="start" disabled>くじを選んでください</button>
      <div class="result" id="result" hidden aria-live="polite">
        <span id="prize-rank" class="award-rank" hidden></span>
        <h2><span id="prize-title"></span><span id="prize-detail" class="award-detail" hidden></span></h2>
        <div class="receipt" id="draw-log" hidden></div>
        <p class="note">結果画面をスタッフにお見せください。</p>
      </div>
      <button class="retry" id="retry" hidden type="button">もう一度お試し</button>
      <p class="note" id="demo-note">現在はお試し版です。結果は自動記録されません。</p>
      <noscript>JavaScriptを有効にしてご利用ください。</noscript>
    </section>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      'use strict';
      const $ = id => document.getElementById(id);
      const tickets = Array.from(document.querySelectorAll('.ticket'));
      const recording = window.DrawRecording === true;
      const prizes = window.DrawPrizes;
      let picked = -1, busy = false, finished = false;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (recording) $('demo-note').textContent = '抽選結果を記録し、受付番号を発行します。結果をスタッフにお見せください。';
      function randomIndex(n) {
        const sample = new Uint32Array(1);
        const limit = Math.floor(4294967296 / n) * n;
        do { crypto.getRandomValues(sample); } while (sample[0] >= limit);
        return sample[0] % n;
      }
      function step(n) { for(let i=1;i<=3;i++) $('step-'+({1:'one',2:'two',3:'three'}[i])).classList.toggle('current',i===n); }
      tickets.forEach((t,i)=>t.addEventListener('click',()=>{
        if(busy||finished)return;
        picked=i;
        tickets.forEach((b,j)=>{b.classList.toggle('selected',i===j);b.setAttribute('aria-pressed',String(i===j));});
        $('start').disabled=false;
        $('start').textContent='このくじをひく →';
        $('instruction').textContent='くじが決まりました。スタートしてください';
      }));
      $('start').addEventListener('click',async()=>{
        if(busy||finished||picked<0)return;
        busy=true;
        $('start').disabled=true;
        tickets.forEach(t=>t.disabled=true);
        step(2);
        $('instruction').textContent='くじを開いています…';
        let selection;
        try { selection=await DrawLog.choose('kuji',randomIndex(prizes.length)); }
        catch(error){
          busy=false; tickets.forEach(t=>t.disabled=false);$('start').disabled=false;step(1);
          $('instruction').textContent='記録の確認に失敗しました。もう一度お試しください。';
          return;
        }
        const ticket=tickets[picked];
        ticket.classList.add('opening');
        if(!reduced) await new Promise(resolve=>setTimeout(resolve,920));
        ticket.classList.remove('opening');ticket.classList.add('opened');
        ticket.querySelector('.icon').textContent='✦';
        DrawLog.render($('prize-rank'),$('prize-title'),$('prize-detail'),selection.prize || prizes[selection.index]);
        DrawLog.finish($('draw-log'),'kuji',selection.id);
        $('result').hidden=false; $('instruction').textContent='おめでとうございます';
        step(3); finished=true;busy=false;$('start').hidden=true;
        if(!recording) $('retry').hidden=false;
      });
      $('retry').addEventListener('click',()=>{
        if(recording)return;
        picked=-1;finished=false;busy=false;
        $('result').hidden=true;$('retry').hidden=true;$('start').hidden=false;$('start').disabled=true;$('start').textContent='くじを選んでください';
        $('instruction').textContent='くじをひとつ選んでください';step(1);
        tickets.forEach(t=>{t.disabled=false;t.classList.remove('opening','opened','selected');t.setAttribute('aria-pressed','false');t.querySelector('.icon').textContent='✧';});
      });
    });
  </script>
</body>
</html>
