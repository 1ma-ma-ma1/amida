<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5ede1">
  <title>ご褒美ルーレット</title>
  <link rel="icon" href="../leaf.svg" type="image/svg+xml">
  <script src="../draw-log.js?v=2"></script>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; --ink: #3b432f; --green: #41573a; --paper: #fffbf4; --muted: #6c6556; }
    body { margin: 0; min-height: 100dvh; background: radial-gradient(ellipse at 50% 4%, #fff7eb, #f1e8da 80%); color: var(--ink); font: 15px/1.7 "Yu Gothic", Meiryo, sans-serif; }
    main { width: min(100% - 28px, 480px); margin: auto; padding: 22px 0; }
    header { text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    h1, h2 { font-family: "Yu Mincho", "Hiragino Mincho ProN", Georgia, serif; letter-spacing: .06em; }
    h1 { margin: 4px 0 0; font-size: clamp(26px, 7.2vw, 36px); }
    .intro { margin: 3px 0 16px; color: var(--muted); font-size: 12px; }
    .game { position: relative; background: var(--paper); border: 1px solid #e1d5c2; border-radius: 24px; padding: 26px 16px 17px; text-align: center; box-shadow: 0 12px 35px #6c4a2b13; }
    .stage { --diameter: min(100%, 285px, 66vw); position: relative; width: var(--diameter); aspect-ratio: 1; margin: 0 auto 19px; }
    .wheel { position: absolute; inset: 0; border-radius: 50%; border: 5px solid #fffcf5; outline: 2px solid #b39260; box-shadow: 0 4px 12px #66533530; }
    .wheel::after { content: ""; position: absolute; inset: 7px; border: 1px solid #fff9; border-radius: 50%; pointer-events: none; }
    .sector { position: absolute; translate: -50% -50%; rotate: var(--label-angle, 0deg); display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #6e583735; border-radius: 50%; background: #fffaf2d9; color: #453a2b; font: bold 17px Georgia, serif; }
    .hub { position: absolute; top: 50%; left: 50%; translate: -50% -50%; display: grid; place-items: center; width: 19%; aspect-ratio: 1; border-radius: 50%; background: var(--paper); border: 2px solid #ba9865; box-shadow: 0 3px 8px #60492330; pointer-events: none; }
    .hub img { width: 78%; }
    .pointer { position: absolute; z-index: 1; top: -14px; left: 50%; translate: -50% 0; width: 27px; height: 31px; background: #546641; clip-path: polygon(3% 3%, 97% 3%, 50% 100%); }
    button { display: block; width: min(100%, 320px); min-height: 52px; margin: auto; border: 0; border-radius: 11px; background: var(--green); color: #fff; font: inherit; font-size: 16px; font-weight: 700; letter-spacing: .11em; cursor: pointer; }
    button:hover:not(:disabled) { background: #32482d; }
    button:focus-visible { outline: 3px solid #b88a43; outline-offset: 3px; }
    button:disabled { opacity: .66; cursor: wait; }
    .status { min-height: 1.7em; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .status--announced { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .result { position: relative; margin: 14px 0 0; padding: 13px 15px; border: 1px solid #dac49f; border-radius: 15px; background: #faf0dd; overflow-wrap: anywhere; }
    .result h2 { margin: 0; font-size: clamp(19px, 5vw, 25px); }
    .result p { margin: 3px 0 0; font-size: 12px; }
    .effect-label { display: block; color: #79582f; font-size: 11px; font-weight: bold; }
    .notes { margin: 13px 6px 0; font-size: 12px; text-align: center; color: var(--muted); }

    .stage::before { content: ""; position: absolute; inset: -7px; border: 2px dotted #a88958; border-radius: 50%; opacity: .65; }
    .pointer { transform-origin: 50% 6%; }
    .is-spinning .pointer { animation: pointer-tick .16s 16 alternate ease-in-out; }
    .is-spinning .wheel { filter: saturate(1.16); }
    .sector.is-winner { color: #fff; background: var(--green); box-shadow: 0 0 0 4px #fffcf5, 0 0 18px #66513260; }
    .result { z-index: 3; }
    .result.show-win { animation: result-in .38s cubic-bezier(.18,.86,.26,1.23) both; }

    .wheel-frame {
      display: grid;
      grid-template-columns: minmax(0, 1fr) min(59vw, 270px) minmax(0, 1fr);
      align-items: stretch;
      margin-bottom: 19px;
    }
    .wheel-frame .stage { width: 100%; margin: 0; }
    .rail {
      position: relative;
      overflow: hidden;
      min-width: 0;
      margin: -12px 0 0;
      pointer-events: none;
    }
    .rail--left { margin-right: 8px; }
    .rail--right { margin-left: 8px; }
    .particle {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: var(--size);
      height: calc(var(--size) * .65);
      background: var(--shade);
      animation: side-fall var(--time) var(--delay) ease-out both;
    }
    .particle--burst { animation-name: side-burst; }
    .curl {
      position: absolute;
      z-index: 1;
      top: var(--top);
      left: var(--left);
      width: 10px;
      height: 55px;
      color: var(--shade);
      background: radial-gradient(ellipse at left center, transparent 42%, currentColor 46% 58%, transparent 63%) 0 0 / 10px 17px repeat-y;
      transform-origin: top;
      animation: curl-unwind 1.8s var(--delay) ease-out both;
    }
    .kusudama {
      position: absolute;
      top: 3%;
      left: 50%;
      translate: -50% 0;
      width: min(38px, 91%);
      height: 100%;
      animation: settle-in .48s ease-out both;
    }
    .suspension { position: absolute; top: 0; left: 50%; width: 1px; height: 17%; background: #866748; }
    .ball { position: absolute; top: 16%; width: 100%; aspect-ratio: 1.02; }
    .ball::before, .ball::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      border: 1px solid #975925;
      background: radial-gradient(ellipse at top, #fff0a8, #d99a40 64%, #9f6225);
    }
    .ball::before { left: 0; border-radius: 100% 0 0 100%; transform-origin: right 5%; animation: split-left 3.25s both; }
    .ball::after { right: 0; border-radius: 0 100% 100% 0; transform-origin: left 5%; animation: split-right 3.25s both; }
    .win-banner {
      position: absolute;
      top: 23%;
      left: 50%;
      z-index: 2;
      translate: -50% 0;
      padding: 7px 3px 12px;
      color: #7a3a23;
      background: #fff1be;
      box-shadow: inset 0 0 0 1px #c9934a;
      font-size: clamp(10px, 3.4vw, 15px);
      line-height: 1.15;
      font-weight: 800;
      writing-mode: vertical-rl;
      white-space: nowrap;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 91%, 0 100%);
      transform-origin: top;
      animation: unfurl 2.45s .70s both;
    }
    .party-popper {
      position: absolute;
      top: 52%;
      left: 50%;
      translate: -50% 0;
      width: min(38px, 86%);
      height: 51px;
      animation: settle-in .34s ease-out both;
    }
    .cone {
      display: block;
      position: absolute;
      inset: 4px 0 5px;
      background: repeating-linear-gradient(11deg, #b06249 0 9px, #edb455 9px 18px, #ffdfa0 18px 20px);
      clip-path: polygon(0 0, 100% 0, 53% 100%, 47% 100%);
      transform-origin: bottom;
      animation: popper-kick .35s .68s both;
    }
    .cone-mouth { position: absolute; top: 0; left: 0; width: 100%; height: 9px; border-radius: 50%; border: 1.5px solid #b67a41; background: #815638; }
    .pull-string { position: absolute; top: 88%; left: 50%; width: 9px; height: 17px; border-left: 1px solid #72533c; border-bottom: 2px solid #a9693a; border-radius: 25% 15% 60% 70%; transform-origin: top left; animation: pull .48s .31s both; }
    .balloon {
      position: absolute;
      left: var(--left);
      top: 78%;
      width: var(--size);
      height: calc(var(--size) * 1.23);
      border-radius: 52% 50% 51% 48% / 50% 48% 57% 55%;
      background: radial-gradient(circle at 29% 23%, #fff9 0 9%, transparent 12%), var(--shade);
      box-shadow: inset -4px -5px #65482e2e;
      animation: balloon-rise 2.55s var(--delay) ease-in-out both;
    }
    .balloon::before { content: ""; position: absolute; bottom: -4px; left: calc(50% - 3px); border: 3px solid transparent; border-bottom: 0; border-top-color: var(--shade); }
    .balloon::after { content: ""; position: absolute; top: 100%; left: 50%; height: 23px; width: 6px; border-left: 1px solid #897557; border-radius: 60%; }
    .clap {
      position: absolute;
      top: var(--top);
      left: 50%;
      translate: -50% -50%;
      font-size: clamp(20px, 7vw, 42px);
      animation: clap .32s var(--delay) ease-in-out 8 alternate both;
    }
    @keyframes pointer-tick { to { rotate: -15deg; } }
    @keyframes result-in { from { opacity: 0; transform: translateY(8px) scale(.93); } }
    @keyframes settle-in { from { opacity: 0; translate: -50% -22px; } }
    @keyframes side-fall { 0% { opacity: 0; } 12%, 76% { opacity: 1; } 100% { opacity: 0; translate: var(--dx) 245px; rotate: 420deg; } }
    @keyframes side-burst { 0% { opacity: 0; scale: .2; } 20%, 64% { opacity: 1; } 46% { translate: var(--dx) var(--peak); rotate: 140deg; } 100% { opacity: 0; translate: var(--dx) 104px; rotate: 440deg; } }
    @keyframes curl-unwind { 0% { opacity: 0; scale: .5 .1; } 24%, 73% { opacity: 1; scale: 1 1; } 100% { opacity: 0; translate: var(--dx) 75px; rotate: 24deg; } }
    @keyframes split-left { 0%, 18% { rotate: 0deg; } 29%, 92% { rotate: 67deg; } 100% { rotate: 67deg; opacity: 0; } }
    @keyframes split-right { 0%, 18% { rotate: 0deg; } 29%, 92% { rotate: -67deg; } 100% { rotate: -67deg; opacity: 0; } }
    @keyframes unfurl { 0% { opacity: 0; scale: 1 0; } 22%, 88% { opacity: 1; scale: 1; } 100% { opacity: 0; } }
    @keyframes pull { 0% { scale: 1 .7; } 55%, 100% { scale: 1 1.65; } }
    @keyframes popper-kick { 35% { translate: 0 4px; rotate: -8deg; } }
    @keyframes balloon-rise { 0% { opacity: 0; translate: 0 45px; } 14%, 77% { opacity: 1; } 46% { translate: var(--dx) -98px; rotate: 9deg; } 100% { opacity: 0; translate: 0 -240px; rotate: -8deg; } }
    @keyframes clap { from { scale: .84; rotate: -14deg; } to { scale: 1.14; rotate: 8deg; } }
    .is-still *, .is-still *::before, .is-still *::after { animation: none !important; }
    .is-still .ball::before { rotate: 67deg; }
    .is-still .ball::after { rotate: -67deg; }
    .is-still .particle, .is-still .balloon { top: var(--still-top); }
    .is-still .particle { left: var(--still-left); rotate: var(--still-tilt); }
    .is-still .pull-string { scale: 1 1.65; }
    @media (max-width: 360px) {
      .game { padding-inline: 12px; }
      .wheel-frame { grid-template-columns: minmax(0, 1fr) 55vw minmax(0, 1fr); }
    }
    .award-detail { display: block; font-size: .5em; margin-top: .2em; letter-spacing: 0; }
    .award-rank { display: block; font-size: 13px; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <a href="../#draw-menu" class="integrated-back" style="display:inline-block;min-height:36px;padding:6px 0;margin-bottom:5px;color:inherit;text-underline-offset:3px;font-size:12px">← 抽選一覧へ戻る</a>
    <header>
      <div class="brand"><img src="../leaf.svg" width="25" height="25" alt="">リラクゼーションサロン</div>
      <h1>ご褒美ルーレット</h1>
      <p class="intro">5つの特典から、ひとつが当たります。</p>
    </header>
    <section class="game" aria-label="ルーレット抽選">
      <div class="wheel-frame" aria-hidden="true">
        <div class="rail rail--left"></div>
        <div class="stage"><div class="wheel" id="wheel"></div><div class="hub"><img src="../leaf.svg" alt=""></div><div class="pointer"></div></div>
        <div class="rail rail--right"></div>
      </div>
      <button id="draw" type="button">抽選開始</button>
      <p class="status" id="status" role="status">テスト期間中は何度でも抽選できます。</p>
      <div id="result" class="result" hidden>
        <span class="effect-label" id="effect-label"></span>
        <span id="prize-rank" class="award-rank" hidden></span><h2><span id="prize-title"></span><span id="prize-description" class="award-detail" hidden></span></h2>
        <div id="draw-log" hidden></div>
      </div>
      <noscript><p>抽選するには、ブラウザでJavaScriptを有効にしてください。</p></noscript>
    </section>
    <p class="notes">結果はスクリーンショットで保存できます。</p>
  </main>
  <script>
    "use strict";
    // 盤面の色と当選演出を等賞順に設定します。
    const sectors = [
      { mark: "A", color: "#dfb77c", effect: "kusudama", label: "くす玉が開きました" },
      { mark: "B", color: "#b9c9a0", effect: "confetti", label: "花吹雪でお祝い" },
      { mark: "C", color: "#e1b9ac", effect: "popper", label: "クラッカーでお祝い" },
      { mark: "D", color: "#decba5", effect: "balloons", label: "風船が舞い上がります" },
      { mark: "E", color: "#bdd0c7", effect: "clap", label: "拍手でお祝い" }
    ];
    const prizes = DrawPrizes.map((prize, i) => ({ ...prize, ...sectors[i] }));
    const $ = id => document.getElementById(id);
    const wheel = $("wheel");
    const stage = wheel.parentElement;
    const result = $("result");
    const draw = $("draw");
    const status = $("status");
    const rails = [...document.querySelectorAll(".rail")];
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const sectorAngle = 360 / prizes.length;
    let rotation = 0;
    let cleanup;

    wheel.style.background = `conic-gradient(from ${-sectorAngle / 2}deg, ${prizes.map((prize, i) => `${prize.color} ${i * sectorAngle}deg ${(i + 1) * sectorAngle}deg`).join(", ")})`;
    prizes.forEach((prize, i) => {
      const angle = i * 2 * Math.PI / prizes.length;
      const sector = document.createElement("span");
      sector.className = "sector";
      sector.textContent = prize.mark;
      sector.style.left = `${50 + 32 * Math.sin(angle)}%`;
      sector.style.top = `${50 - 32 * Math.cos(angle)}%`;
      wheel.append(sector);
    });

    function choosePrize() {
      const sample = new Uint32Array(1);
      const limit = Math.floor(2 ** 32 / prizes.length) * prizes.length;
      do { crypto.getRandomValues(sample); } while (sample[0] >= limit);
      return sample[0] % prizes.length;
    }

    function prop(element, name, value) {
      element.style.setProperty("--" + name, value);
    }

    function art(parent, className, content = "") {
      const item = document.createElement("span");
      item.className = className;
      item.textContent = content;
      parent.append(item);
      return item;
    }

    const palette = ["#e1a841", "#7aab63", "#db8091", "#58a8a6", "#a28ac2"];

    function scatter(rail, count, origin = null) {
      for (let i = 0; i < count; i++) {
        const piece = art(rail, origin ? "particle particle--burst" : "particle");
        prop(piece, "left", (origin ? 46 : Math.random() * 84) + "%");
        prop(piece, "top", (origin ? origin.top : Math.random() * 12) + "%");
        prop(piece, "dx", (Math.random() - .5) * 38 + "px");
        prop(piece, "peak", (origin ? origin.peak - Math.random() * 48 : 0) + "px");
        prop(piece, "size", (3 + Math.random() * 5) + "px");
        prop(piece, "shade", palette[i % palette.length]);
        prop(piece, "delay", ((origin?.delay ?? 0) + Math.random() * (origin ? 180 : 820)) + "ms");
        prop(piece, "time", (1080 + Math.random() * 800) + "ms");
        prop(piece, "still-top", (6 + Math.random() * 80) + "%");
        prop(piece, "still-left", (4 + Math.random() * 78) + "%");
        prop(piece, "still-tilt", Math.random() * 180 + "deg");
      }
    }

    function celebrate(effect) {
      const still = reduceMotion.matches;
      for (const rail of rails) {
        rail.classList.toggle("is-still", still);
        if (effect === "kusudama") {
          const hanging = art(rail, "kusudama");
          art(hanging, "suspension");
          art(hanging, "ball");
          art(rail, "win-banner", "おめでとう！");
          scatter(rail, 21, { top: 24, peak: -4, delay: 700 });
          [4, 67].forEach((left, i) => {
            const tape = art(rail, "curl");
            prop(tape, "top", "27%");
            prop(tape, "left", left + "%");
            prop(tape, "shade", palette[i + 2]);
            prop(tape, "delay", (745 + i * 95) + "ms");
            prop(tape, "dx", (i ? 5 : -5) + "px");
          });
        } else if (effect === "confetti") {
          scatter(rail, 31);
        } else if (effect === "popper") {
          const popper = art(rail, "party-popper");
          art(popper, "cone");
          art(popper, "cone-mouth");
          art(popper, "pull-string");
          scatter(rail, 28, { top: 53, peak: -80, delay: 665 });
        } else if (effect === "balloons") {
          for (let i = 0; i < 5; i++) {
            const balloon = art(rail, "balloon");
            prop(balloon, "left", (i % 2 ? 33 : 5) + "%");
            prop(balloon, "size", (16 + Math.random() * 11) + "px");
            prop(balloon, "shade", palette[i]);
            prop(balloon, "dx", (i % 2 ? -7 : 7) + "px");
            prop(balloon, "delay", (i * 130) + "ms");
            prop(balloon, "still-top", (7 + i * 15) + "%");
          }
        } else if (effect === "clap") {
          [27, 62].forEach((top, i) => {
            const hands = art(rail, "clap", "👏");
            prop(hands, "top", top + "%");
            prop(hands, "delay", (i * 150) + "ms");
          });
        }
      }
      if (!still) cleanup = setTimeout(clearCelebration, 3450);
    }

    function clearCelebration() {
      rails.forEach(rail => rail.replaceChildren());
    }

    draw.addEventListener("click", async () => {
      draw.disabled = true;
      clearTimeout(cleanup);
      clearCelebration();
      result.hidden = true;
      result.classList.remove("show-win");
      wheel.querySelector(".is-winner")?.classList.remove("is-winner");
      status.classList.remove("status--announced");
      status.textContent = "抽選中です…";
      try {
        const selection = await DrawLog.choose("roulette", choosePrize());
        const index = selection.index;
        const prize = prizes[index];
        const target = (360 - index * sectorAngle) % 360;
        const travel = 360 * 5 + (target - rotation + 360) % 360;
        if (!reduceMotion.matches && typeof wheel.animate === "function") {
          const frames = [
            { time: 0, turns: 0, easing: "cubic-bezier(.52,.03,.78,.62)" },
            { time: .22, turns: .14, easing: "linear" },
            { time: .60, turns: .75, easing: "cubic-bezier(.18,.55,.34,1)" },
            { time: 1, turns: 1 }
          ].map(({ time, turns, easing }) => ({ offset: time, transform: "rotate(" + (rotation + travel * turns) + "deg)", easing }));
          stage.classList.add("is-spinning");
          const spin = wheel.animate(frames, { duration: 3000, fill: "forwards" });
          try { await spin.finished; } catch (_) { /* Preserve the chosen result. */ }
          wheel.style.transform = "rotate(" + target + "deg)";
          spin.cancel();
        } else {
          wheel.style.transform = "rotate(" + target + "deg)";
        }
        rotation = target;
        wheel.style.setProperty("--label-angle", `${-target}deg`);
        $("effect-label").textContent = prize.label;
        DrawLog.render($("prize-rank"), $("prize-title"), $("prize-description"), prize);
        wheel.children[index].classList.add("is-winner");
        result.hidden = false;
        if (!reduceMotion.matches) result.classList.add("show-win");
        status.classList.add("status--announced");
        status.textContent = `${prize.title}が当たりました。`;
        celebrate(prize.effect);
        DrawLog.finish($("draw-log"), "roulette", selection.id);
      } catch (_) {
        status.classList.remove("status--announced");
        status.textContent = "抽選できませんでした。もう一度お試しください。";
      } finally {
        stage.classList.remove("is-spinning");
        draw.disabled = false;
      }
    });
  </script>
</body>
</html>
